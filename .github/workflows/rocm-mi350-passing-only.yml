name: ROCm MI350 passing-only
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rocm-mi350-CI-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, mi350, passing]
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        test:
          - tests/e2e/fsdp/test_qwen3_4B_fsdp_hybrid_shard_r2s2.py
          - tests/e2e/megatron/test_glm47_flash/test_r3_mtp.py
          - tests/e2e/megatron/test_qwen3_5_35B_A3B_mtp/test_mtp1_spec_v2_r3.py
          - tests/e2e/megatron/test_qwen3_30B_A3B/test_deepep_fp8_bridge.py
          - tests/e2e/megatron/test_qwen3_4B_offload_disk_stream.py
          - tests/e2e/megatron/model_scripts/test_glm5_2_744b_a40b_5layer_ci.py
          - tests/e2e/megatron/model_scripts/test_inkling_small_4layer_ci.py
          - tests/e2e/megatron/model_scripts/test_deepseek_v4_flash_4layer_ci.py
    container:
      image: rocm/sgl-dev:miles-rocm720-mi35x-20260805
      options: >-
        --device /dev/kfd --device /dev/dri
        --group-add 44 --group-add 109
        --security-opt seccomp=unconfined
        --ipc=host --shm-size=32g
        --privileged
        --ulimit memlock=-1 --ulimit stack=67108864
        --env HIP_VISIBLE_DEVICES
        -v /data/miles_ci:/data/miles_ci
        -v /data/miles_ci/models:/root/models
        -v /data/miles_ci/datasets:/root/datasets
        -v /data/miles_ci/hf_cache:/root/.cache/huggingface
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      PYTHONPATH: ${{ github.workspace }}
      HF_HOME: /root/.cache/huggingface
      GITHUB_COMMIT_NAME: ${{ github.sha }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for ROCm GPUs
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if rocm-smi --showid >/dev/null 2>&1; then
              echo "ROCm ready after $((i-1)) retry(s)"
              rocm-smi --showproductname 2>/dev/null | head || true
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: rocm-smi did not become ready after 120s" >&2
          exit 1
      - name: Install miles (SGLang + Megatron are baked into the image)
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          pip install -e . --no-deps --break-system-packages
          pip install polars --break-system-packages || true
          pip install nvidia-modelopt --break-system-packages || true
      - name: Run ${{ matrix.test }}
        shell: bash
        run: |
          echo "=== running ${{ matrix.test }} ==="
          PYTHONPATH="$GITHUB_WORKSPACE" python3 "${{ matrix.test }}"
